; Guidearr PHP-FPM pool overrides. Installed as php-fpm.d/zz-guidearr.conf so it loads after
; the image's www.conf and zz-docker.conf — FPM reads php-fpm.d/*.conf in name order and a
; later [www] value wins.
;
; The image default is pm.max_children = 5. A Laravel 404 costs ~45 ms, so five workers
; serve ~110 requests/s in total, and a single scanner fetching sitemap/api-docs/team-style
; paths at 150+/s held all five: the pool logged "server reached pm.max_children" roughly
; twenty times a day, and every real request queued behind the scan while it lasted.
;
; Two halves fix that, and this is the smaller one. The per-IP limit in docker/nginx.conf
; (zone `php`) is what stops one address taking the whole pool; this just leaves headroom.
;
; Memory: an idle worker is ~40 MB, so ten is ~400 MB. memory_limit (256M, docker/php.ini)
; is a per-request ceiling sized for resizing a branding upload, not what a worker holds.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
