; Guidearr PHP overrides. The official php:*-fpm images ship NO php.ini — only the
; php.ini-development / php.ini-production templates — so without this file PHP runs on
; its compiled-in defaults, which are far smaller than the app advertises.
;
; The layers must agree, outermost first, or a request dies at the wrong one:
;
;   nginx client_max_body_size  20M   (docker/nginx.conf)
;   post_max_size               16M   <- whole request body
;   upload_max_filesize         12M   <- the file itself
;   Laravel validation          10M   (branding upload rule)
;
; Laravel's rule is deliberately the tightest, so an oversized file produces a clear
; validation message instead of a failure lower down the stack. Previously
; upload_max_filesize was 2M and post_max_size 8M while nginx accepted 20M: a body over
; 8M made PHP abort without reading it, nginx waited out fastcgi_read_timeout, and the
; user got a 504 after five minutes.
upload_max_filesize = 12M
post_max_size = 16M

; Resizing an upload decodes it to a bitmap at 4 bytes per pixel and holds the source and
; the destination at once — a 10M PNG can be 6000x6000, which is ~144MB per bitmap. The
; downscaler checks the limit and declines rather than dying, but at the 128M default it
; would decline on exactly the images that most need shrinking.
memory_limit = 256M

; php2shell (CVE-2026-109618) hardening: the session upload-progress handler was one of the
; two exploit paths. Nothing in Guidearr uses upload progress, so leave it off for good.
session.upload_progress.enabled = 0

; Error handling. Without these, PHP runs on its compiled-in DEVELOPMENT defaults:
; display_errors=On, display_startup_errors=On, log_errors=Off, expose_php=On. A warning
; raised by the engine before Laravel runs — "Missing boundary in multipart/form-data",
; "POST Content-Length exceeds the limit" — was printed INTO the response body, and
; because output had started, Laravel's own 405/413 could not be sent ("headers already
; sent") and the client got a 200 carrying the warning text. Warnings now go to stderr
; (docker compose logs app) and nothing about PHP is sent to the client.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
