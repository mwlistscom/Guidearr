# Which addresses are allowed to tell us the client's IP.
#
# This file exists on its own so it can be replaced without copying the whole of nginx.conf.
# To narrow it for your install, mount your own version over it from a
# docker-compose.override.yml (which Compose merges automatically and which is not committed):
#
#     services:
#       web:
#         volumes:
#           - ./docker/real-ip.local.conf:/etc/nginx/real-ip.conf:ro
#
# ⚠️ Trusting a range means trusting everything IN it. Any host that can open a connection from
# a trusted address can send its own X-Forwarded-For and be believed — and that decides what the
# playlist IP-lock sees, and which addresses the threat feed treats as a customer rather than a
# scanner. So trust the proxy, not the network the proxy happens to sit on.
#
# To find the one address that actually needs trusting, look at what the container sees while
# real traffic is arriving — not at what you see from the host, which NATs differently:
#
#     docker compose exec web sh -c 'netstat -tn | grep :8080'
#
# The peer column is your proxy. Replace the ranges below with just that:
#
#     set_real_ip_from 192.168.1.2;
#
# The defaults are deliberately broad, because a default that is too narrow silently breaks the
# real client IP for every install whose proxy sits somewhere this did not guess — and that
# failure is much harder to notice than an over-broad trust.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
